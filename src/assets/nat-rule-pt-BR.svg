<svg xmlns="http://www.w3.org/2000/svg" width="1670" height="940" viewBox="0 0 1670 940" role="img" aria-labelledby="title desc">
  <title id="title">Como ler a regra NAT</title>
  <desc id="desc">Uma regra nftables associa a saída eth1 e a origem de PC1 ao mascaramento do endereço.</desc>
  <rect width="1670" height="940" fill="#101114"/>
  <rect x="14" y="16" width="1642" height="904" rx="15" fill="none" stroke="#c2aa79" stroke-width="1.5"/>
  <path d="M14 88 H1656" stroke="#c2aa79" stroke-width="1.5"/>
  <path d="M82 88 V46 Q82 31 98 31 H256 Q272 31 272 46 V88" fill="#1a1b1c" stroke="#d1bc89" stroke-width="2"/>
  <g fill="#f1f1ed" font-family="monospace">
    <text x="140" y="69" font-size="31" font-weight="bold">Borda</text>
    <text x="230" y="68" font-size="26">×</text>
    <text x="44" y="140" font-size="31"><tspan fill="#87c982">Borda</tspan>:~$ nft list ruleset</text>
    <text x="80" y="205" font-size="35" textLength="1160" lengthAdjust="spacingAndGlyphs">oifname "eth1" ip saddr 192.168.60.10 masquerade</text>
    <text x="44" y="334" font-size="31"><tspan fill="#87c982">Borda</tspan>:~$ ▯</text>
  </g>
  <g fill="none" stroke="#e3ca8b" stroke-width="2">
    <path d="M80 216 H249 M297 216 H394 M442 216 H659 M660 216 H974 M998 216 H1240"/>
  </g>
  <g font-family="monospace" text-anchor="middle" font-size="19" font-weight="bold">
    <g fill="#c7a865"><circle cx="164" cy="247" r="16"/><circle cx="345" cy="247" r="16"/><circle cx="550" cy="247" r="16"/><circle cx="817" cy="247" r="16"/><circle cx="1119" cy="247" r="16"/></g>
    <g fill="#101114"><text x="164" y="254">1</text><text x="345" y="254">2</text><text x="550" y="254">3</text><text x="817" y="254">4</text><text x="1119" y="254">5</text></g>
  </g>
  <path d="M20 365 H265 l27 -27 h372 l28 27 h402 l32 -34 h373 l30 -30 h118" fill="none" stroke="#594c36" opacity=".45"/>
  <rect x="40" y="453" width="1590" height="400" rx="12" fill="none" stroke="#a79c88" stroke-width="1.5"/>
  <g stroke="#70695d" stroke-width="1.3"><path d="M40 533 H1630 M40 613 H1630 M40 693 H1630 M40 773 H1630"/><path d="M448 472 V514 M448 552 V594 M448 632 V674 M448 712 V754 M448 792 V834"/></g>
  <g fill="none" stroke="#e3ca8b" stroke-width="1.5">
    <rect x="114" y="472" width="295" height="42" rx="8"/><rect x="114" y="552" width="295" height="42" rx="8"/><rect x="114" y="632" width="295" height="42" rx="8"/><rect x="114" y="712" width="295" height="42" rx="8"/><rect x="114" y="792" width="295" height="42" rx="8"/>
  </g>
  <g font-family="monospace" font-size="27" fill="#f1f1ed">
    <g fill="#ddc082" text-anchor="middle" font-size="22" font-weight="bold"><text x="78" y="502">1</text><text x="78" y="582">2</text><text x="78" y="662">3</text><text x="78" y="742">4</text><text x="78" y="822">5</text></g>
    <g font-weight="bold"><text x="133" y="502">oifname</text><text x="133" y="582">eth1</text><text x="133" y="662">ip saddr</text><text x="133" y="742">192.168.60.10</text><text x="133" y="822">masquerade</text></g>
    <text x="480" y="502">Output Interface Name · nome da interface de saída.</text>
    <text x="480" y="582">Interface Ethernet pela qual o pacote sai.</text>
    <text x="480" y="662">IPv4 Source Address · endereço IPv4 de origem.</text>
    <text x="480" y="742">IP de PC1 · a regra inicial não inclui PC2.</text>
    <text x="480" y="822">Mascaramento · troca a origem pelo IP da interface de saída.</text>
  </g>
</svg>
